<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Chrome Dino // Sacred Run</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main class="game-shell" aria-label="Dino game">
    <header class="topbar">
      <div class="brand"><span class="brand-mark">D</span><span>CHROME RUN</span></div>
      <div class="status"><span class="status-dot"></span><span id="statusText">READY</span></div>
    </header>
    <section class="game-frame">
      <div class="scoreboard" aria-live="polite"><span class="score-label">SCORE:</span> <span id="score">00000</span><span class="score-divider">/</span><span>∞</span><span class="timer-divider">|</span><span id="timer">TIME: 00:00.00</span><span class="timer-divider">|</span><span id="speedReadout">SPEED: 1.0x</span></div>
      <canvas id="game" width="960" height="300" aria-label="Dino game canvas"></canvas>
      <div class="warning" id="warning"></div>
      <div class="glitch-overlay" id="glitchOverlay"><strong>SYSTEM ERROR</strong><span>SYNC LOST // RESUME IN 2.00</span></div>
      <div class="blank-overlay" id="blankOverlay"><strong>BE AWARE!</strong></div>
      <div class="message" id="message">
        <div class="message-kicker">SACRED RUN / 01</div>
        <h1>THE DINO JUMP</h1>
        <p id="messageText">Press <kbd>SPACE</kbd> or <kbd>UP</kbd> to begin</p>
        <div class="message-rule"></div>
        <small id="messageDetail">Keep going forever</small>
      </div>
      <div class="milestone" id="milestone"></div>
    </section>
    <footer class="controls"><span>SPACE / UP <b>JUMP</b></span><span>TOUCH <b>JUMP</b></span><span>R <b>RESTART</b></span></footer>
  </main>
  <script src="game-enhanced.js"></script>
</body>
</html>
